<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1196" viewBox="0 0 1500 1196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="45" font-size="24" font-weight="700" fill="#1f2933" text-anchor="middle">庭审对抗分析表 · 甲方学校与乙方公司买卖合同纠纷（一审）</text><text x="750.0" y="76" font-size="14" font-weight="400" fill="#6b7280" text-anchor="middle">原告向推演 · 材料成熟度 L2 · 合成示例</text><rect x="54" y="100" width="390" height="54" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="249.0" y="134" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">提出请求的一方</text><rect x="504" y="100" width="390" height="54" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="699.0" y="134" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">法院审查</text><rect x="954" y="100" width="390" height="54" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="1149.0" y="134" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">抗辩的一方</text><line x1="54" y1="195" x2="1344" y2="195" stroke="#cbd0d7" stroke-dasharray="6 5"/><text x="54" y="219" font-size="16" font-weight="700" fill="#991b1b" text-anchor="start">P1·本诉：解除合同</text><rect x="54" y="229" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><rect x="504" y="229" width="390" height="126" rx="8" fill="#ffffff" stroke="#cbd0d7"/><rect x="954" y="229" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="67" y="253" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P1-1 · 主张</text><text x="67" y="276" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">两次交付均未通过验收，未通过原因载明与招标文件和合同</text><text x="67" y="294" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">承诺设备性能参数严重不符</text><text x="517" y="253" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P1-1 · 设备不符合合同及招标文件技术参数</text><text x="517" y="276" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">法院须先比对合同与招标文件所约定的技术参数，再比对两次交付设备的实测参数；差异是否达到不符合约</text><text x="517" y="294" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">定的程度，是本要件的核心。抗辩方在收到验收结果之日起七日内未提出书面异议的，依合同约定视为认可</text><text x="517" y="312" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">验收结果，此为约定的证明负担转换。</text><text x="967" y="253" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">回应</text><text x="967" y="276" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">设备产品质量合格并达到招标文件各项技术参数要求，图像</text><text x="967" y="294" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">模糊系主观判断</text><path d="M444,292 H504" stroke="#9ca3af" stroke-width="2" fill="none"/><path d="M954,292 H894" stroke="#9ca3af" stroke-width="2" fill="none"/><text x="517" y="375" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">关键证据：原证2·招标文件；原证3·投标文件；原证6·两次查验情况表</text><rect x="54" y="390" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><rect x="504" y="390" width="390" height="126" rx="8" fill="#ffffff" stroke="#cbd0d7"/><rect x="954" y="390" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="67" y="414" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P1-2 · 主张</text><text x="67" y="437" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">双方于约定日期签订编号合同</text><text x="517" y="414" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P1-2 · 合同成立并生效（隐含前提）</text><text x="517" y="437" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">合同是否成立并生效，属请求权的隐含前提。双方签章齐备且无效力瑕疵主张的，法院一般不再展开审查。</text><text x="967" y="414" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">回应</text><text x="967" y="437" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">无异议</text><path d="M444,453 H504" stroke="#9ca3af" stroke-width="2" fill="none"/><path d="M954,453 H894" stroke="#9ca3af" stroke-width="2" fill="none"/><text x="517" y="536" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">关键证据：原证1·买卖合同</text><text x="54" y="566" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">小结：两次验收均未通过且抗辩方未在约定期间内提出书面异议，解除条件在法律上能够成立；能否成立系于设备实测参数与约定参数的差异能否被证明到高度盖然性的程度，故本板块为本案决定性所在，须优先补强实测与鉴定。</text><line x1="54" y1="626" x2="1344" y2="626" stroke="#cbd0d7" stroke-dasharray="6 5"/><text x="54" y="650" font-size="16" font-weight="700" fill="#991b1b" text-anchor="start">P2·本诉：违约金</text><rect x="54" y="660" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><rect x="504" y="660" width="390" height="126" rx="8" fill="#ffffff" stroke="#cbd0d7"/><rect x="954" y="660" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="67" y="684" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P2-1 · 主张</text><text x="67" y="707" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">抗辩方在知道验收结果之日起七日内未提出书面异议，依约</text><text x="67" y="725" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">视为认可验收结果</text><text x="517" y="684" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P2-1 · 解除条件成就且解除通知已送达</text><text x="517" y="707" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">法院须审查合同第九条所定解除条件是否成就、解除通知是否送达并于何时生效；违约金按合同总金额的约</text><text x="517" y="725" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">定比例计算，已收履约保证金应否折抵，法院会一并处理。抗辩方主张违约金过高的，法院可依请求酌减。</text><text x="967" y="684" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">回应</text><text x="967" y="707" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">不同意解除合同，不需要支付相应的违约金</text><path d="M444,723 H504" stroke="#9ca3af" stroke-width="2" fill="none"/><path d="M954,723 H894" stroke="#9ca3af" stroke-width="2" fill="none"/><text x="517" y="806" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">关键证据：原证9·律师函及签收记录；原证1·合同第九条</text><text x="54" y="836" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">小结：违约金请求以解除条件成就为前提，与P1同进退；解除通知的送达已有书证支撑，本板块风险主要在违约金数额可能被酌减，以及履约保证金的折抵口径。</text><line x1="54" y1="896" x2="1344" y2="896" stroke="#cbd0d7" stroke-dasharray="6 5"/><text x="54" y="920" font-size="16" font-weight="700" fill="#991b1b" text-anchor="start">P3·反诉：继续履行</text><rect x="54" y="930" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><rect x="504" y="930" width="390" height="126" rx="8" fill="#ffffff" stroke="#cbd0d7"/><rect x="954" y="930" width="390" height="126" rx="8" fill="#f3f4f6" stroke="#cbd0d7"/><text x="67" y="954" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P3-1 · 主张</text><text x="67" y="977" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">判令接收四套设备，继续履行合同</text><text x="517" y="954" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">P3-1 · 合同未解除且具备继续履行条件</text><text x="517" y="977" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">法院须先判断合同是否已因解除通知送达而解除；已解除的，继续履行请求权自始不成立。纵未解除，亦须</text><text x="517" y="995" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">审查标的物的使用场合是否已经过去、继续履行是否仍有实际意义。</text><text x="967" y="954" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">回应</text><text x="967" y="977" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">合同已依法解除，不存在继续履行的基础；使用场合已过，</text><text x="967" y="995" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">合同目的无法实现</text><path d="M444,993 H504" stroke="#9ca3af" stroke-width="2" fill="none"/><path d="M954,993 H894" stroke="#9ca3af" stroke-width="2" fill="none"/><text x="517" y="1076" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">关键证据：原证9·律师函；使用场合已过的证明</text><text x="54" y="1106" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">小结：反诉以合同未解除为前提，一旦P1成立则本板块随之落空；且反诉方自陈设备两次被拒收而未主张任何维续事由，在不看证据的层面即已不利。</text></svg>