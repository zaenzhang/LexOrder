name: Chronicle Sidecar acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/chronicle-sidecar.yml
      - desktop/personal-chronicle/**
      - tools/workbench-m1/**
  pull_request:
    paths:
      - .github/workflows/chronicle-sidecar.yml
      - desktop/personal-chronicle/**
      - tools/workbench-m1/**
      - prisma/**
      - package-lock.json
      - next.config.mjs
      - src/proxy.ts
      - src/app/api/personal/**
      - src/lib/runtime/**

permissions:
  contents: read

jobs:
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/personal-chronicle/package.json
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm ci --prefix tools/workbench-m1
      - run: pnpm install --frozen-lockfile
        working-directory: desktop/personal-chronicle
      - run: pnpm run lint && pnpm run kit:check && pnpm run typecheck && pnpm run test
        working-directory: desktop/personal-chronicle
      - name: Build Chronicle and the single HTTP runtime
        run: bun run build:desktop
        working-directory: tools/workbench-m1
      - name: Test host capability and readiness rules
        run: cargo test --locked --manifest-path desktop/personal-chronicle/desktop-preview/Cargo.toml
      - name: Build Tauri with the native Bun external binary
        run: bun run desktop --build-only
        working-directory: tools/workbench-m1
      - name: Create a case, stop, reopen and verify permissions
        run: bun --no-env-file --no-install tools/workbench-m1/chronicle-smoke/sidecar.mjs "${{ runner.temp }}/lexorder-sidecar-case"
      - name: Build the native package
        run: bun run desktop --package
        working-directory: tools/workbench-m1
      - name: Install and smoke the Windows NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem desktop/personal-chronicle/desktop-preview/target/release/bundle/nsis/*.exe)
          if ($bundles.Count -ne 1) { throw "Expected one NSIS installer" }
          $install = Join-Path $env:RUNNER_TEMP 'lexorder-installed'
          $setup = Start-Process -FilePath $bundles[0].FullName -ArgumentList @('/S', ("/D=" + $install)) -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "NSIS exited with code $($setup.ExitCode)" }
          $env:LEXORDER_SMOKE_RUNTIME_ROOT = Join-Path $install 'lexorder-runtime'
          $env:LEXORDER_SMOKE_BUN = Join-Path $install 'lexorder-bun.exe'
          bun --no-env-file --no-install tools/workbench-m1/chronicle-smoke/sidecar.mjs (Join-Path $env:RUNNER_TEMP 'lexorder-installed-case')
      - name: Verify and smoke the Apple Silicon DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(desktop/personal-chronicle/desktop-preview/target/release/bundle/dmg/*.dmg)
          test "${#bundles[@]}" -eq 1
          hdiutil verify "${bundles[0]}"
          mount="$RUNNER_TEMP/lexorder-dmg"
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${bundles[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          test "${#apps[@]}" -eq 1
          export LEXORDER_SMOKE_RUNTIME_ROOT="${apps[0]}/Contents/Resources/lexorder-runtime"
          export LEXORDER_SMOKE_BUN="${apps[0]}/Contents/MacOS/lexorder-bun"
          bun --no-env-file --no-install tools/workbench-m1/chronicle-smoke/sidecar.mjs "$RUNNER_TEMP/lexorder-installed-case"
      - name: Extract and smoke the Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(desktop/personal-chronicle/desktop-preview/target/release/bundle/deb/*.deb)
          test "${#bundles[@]}" -eq 1
          install="$RUNNER_TEMP/lexorder-deb"
          dpkg-deb -x "${bundles[0]}" "$install"
          runtime=$(find "$install/usr/lib" -type d -name lexorder-runtime -print -quit)
          test -n "$runtime"
          export LEXORDER_SMOKE_RUNTIME_ROOT="$runtime"
          export LEXORDER_SMOKE_BUN="$install/usr/bin/lexorder-bun"
          bun --no-env-file --no-install tools/workbench-m1/chronicle-smoke/sidecar.mjs "$RUNNER_TEMP/lexorder-installed-case"
      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: lexorder-windows-nsis
          path: desktop/personal-chronicle/desktop-preview/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: lexorder-macos-dmg
          path: desktop/personal-chronicle/desktop-preview/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
