function saveEditor(id){const d=byId(id);const val=E('editorText')?.value;if(!d||val===undefined)return;if(isReadOnly()||!isAvailable()){toast('归档或目录失联时不能回传工作稿。',true);return;}if(val===contentText(d)){closeLayer();toast('正文没有变化，不产生新版本。');return;}if(latest(d).id!==d.id){closeLayer();toast('当前不是此文书版本族的最新工作稿，禁止覆盖。',true);return;}const baseFamily=docs[state.caseId].filter(x=>x.family===d.family);const v=Math.max(...baseFamily.map(x=>x.v))+1;d.isLatest=false;d.historical=true;const idNext=`${state.caseId}-${200+v}`;const next={...d,id:idNext,v,isLatest:true,status:'DRAFT',sourceOrigin:'TEAM_PRODUCED',editable:true,historical:false,original:false,frozen:false,approved:false,date:'11月20日',subtitle:`答辩意见 · 自动回传 V${v}`,intro:val.split('\n\n')[1]||val,paragraphs:val.split('\n\n').slice(2),pages:Math.max(1,d.pages),size:d.size};docs[state.caseId].push(next);closeLayer();state.selectedId=idNext;state.page=1;render();setUrl(true);toast(`工作稿已模拟回传为 V${v}（${idNext}）；历史 V1/V2 和既有交付引用保持原样。`);}

document.addEventListener('change',e=>{
 const target=e.target;
 if(target.matches('[data-upload-field]')){const field=target.dataset.uploadField;const value=target.value;const index=state.importSelected;const q=Number.isInteger(index)?state.importQueue[index]:null;const focusId=target.id;if(target.closest('.workflow-defaults'))applyUploadField('default',field,value);else if(q)applyUploadField(index,field,value);if(focusId)E(focusId)?.focus();return;}
