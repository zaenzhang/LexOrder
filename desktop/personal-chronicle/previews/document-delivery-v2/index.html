          <label>委托主体<input readonly value="${esc(caseInfo[t.caseId].client)}"><small>来自当前案件，不在此处修改</small></label>
          <label>对方当事人<select id="lex-template-opposing">${[caseInfo[t.caseId].opposing, '其他 / 待确认'].map(value => `<option ${value === t.opposing ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></label>
          <label>第三人（可选）<select id="lex-template-third"><option value="">未指定</option>${[caseInfo[t.caseId].third, '其他 / 待确认'].map(value => `<option ${value === t.third ? 'selected' : ''}>${esc(value)}</option>`).join('')}</select></label>
          <label>所属程序<select id="lex-template-proc">${caseInfo[t.caseId].procedures.map((name, index) => `<option value="${index}" ${String(index) === String(t.proc) ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></label>
        </div>
      </section>
      <section class="lx-template-section">
        <div class="lx-section-heading"><div><h2>引用材料</h2></div><span class="lx-count">${t.sources.length} 项已选</span></div>
        <div class="lex-source-picker"><div>${caseInfo[t.caseId].sources.map(name => `<label><input type="checkbox" data-lex-source="${esc(name)}" ${t.sources.includes(name) ? 'checked' : ''}><span>${esc(name)}</span><small>固定版本</small></label>`).join('')}</div></div>
      </section>
      <section class="lx-template-section lx-template-content-section">
        <div class="lx-section-heading"><div><h2>本次文书要点</h2></div></div>
        <label class="lx-body-field"><span>文书内容与起草要点</span><textarea id="lex-template-body" rows="8">${esc(t.body)}</textarea></label>
      </section>
      <p class="lx-form-note">主体、程序或引用材料发生变化后，先重新核对实际字段；核对状态失效时不能生成。</p>`;
    if (t.step === 3) body = `
      <section class="lx-template-section">
        <div class="lx-section-heading"><div><h2>核对内容</h2></div></div>
        <div class="lex-review-summary">
          <div class="lx-summary-group"><h3>文书信息</h3><dl><div><dt>文书名称</dt><dd>${esc(t.title)}</dd></div><div><dt>适用模板</dt><dd>${esc(t.template)}</dd></div><div><dt>保存卷宗</dt><dd>${esc(t.folder)}</dd></div></dl></div>
          <div class="lx-summary-group"><h3>主体与程序</h3><dl><div><dt>委托主体</dt><dd>${esc(caseInfo[t.caseId].client)}</dd></div><div><dt>对方当事人</dt><dd>${esc(t.opposing)}</dd></div><div><dt>第三人</dt><dd>${esc(t.third || '未指定')}</dd></div><div><dt>所属程序</dt><dd>${esc(caseInfo[t.caseId].procedures[Number(t.proc) || 0])}</dd></div></dl></div>
          <div class="lx-summary-group"><h3>引用材料</h3><ul>${selectedSources}</ul></div>
          <div class="lx-summary-group"><h3>本次文书要点</h3><p class="lx-summary-body">${esc(t.body)}</p></div>
        </div>
        ${t.prepared ? '<div class="lex-confirmed">本次主体、程序、引用材料和实际字段已重新核对。</div>' : '<button class="btn" data-template-recheck>重新核对实际字段</button>'}
        <label class="lex-check"><input type="checkbox" id="lex-template-checked" ${t.checked ? 'checked' : ''} ${t.prepared ? '' : 'disabled'}><span>我已核对本次文书的主体、程序、引用材料与字段</span></label>
      </section>`;
    const inspector = `
      <aside class="lex-template-inspector" aria-label="本次起草信息">
        <div class="lex-inspector-head">本次起草</div>
        <section><small>案件</small><strong>${esc(caseInfo[t.caseId].name)}</strong><p>${esc(caseInfo[t.caseId].code)}</p></section>
        <section><small>模板</small><strong>${esc(selectedTemplate)}</strong></section>
        <section><small>委托主体</small><strong>${esc(caseInfo[t.caseId].client)}</strong></section>
        <section><small>程序</small><strong>${esc(caseInfo[t.caseId].procedures[Number(t.proc) || 0])}</strong></section>
        <section><small>引用材料</small><strong>${t.sources.length} 项</strong></section>
        <section><small>保存卷宗</small><strong>${esc(t.folder || '未指定')}</strong></section>
      </aside>`;
    return `<div class="lex-template-overlay" id="lex-template-overlay"><div class="lex-template-page">
      <header><div><p class="lx-template-breadcrumb">${esc(caseInfo[t.caseId].code)} <span>/</span> ${esc(caseInfo[t.caseId].name)} <span>/</span> 文书台</p><h1>从模板起草</h1><span>案件文书 · 新建工作稿</span></div><button class="btn" data-template-close>返回文书台</button></header>
      <ol class="lex-stepper" aria-label="起草步骤">${stepper}</ol>
      <div class="lex-template-layout"><main class="lex-template-main">${body}</main>${inspector}</div>
      <footer><button class="btn" data-template-back>${t.step === 1 ? '取消起草' : '上一步'}</button><span>第 ${t.step} / 3 步</span>${t.step < 3 ? `<button class="btn primary" data-template-next ${t.step === 1 && !t.template || t.step === 2 && (!t.title.trim() || !t.body.trim()) ? 'disabled' : ''}>${t.step === 1 ? '使用此模板' : '继续核对'}</button>` : `<button class="btn primary" data-template-generate ${!t.prepared || !t.checked || !t.title.trim() || !t.body.trim() ? 'disabled' : ''}>生成工作稿</button>`}</footer>
    </div></div>`;
  }
  function renderTemplateWizard() {
    const current = state.template;
    if (!current) return;
    const matter = readDb()?.[current.caseId];
    if (!matter) return;
    document.getElementById('lex-template-overlay')?.remove();
    document.body.insertAdjacentHTML('beforeend', templateOverlayHtml(current, matter));
    const overlay = document.getElementById('lex-template-overlay');
    const breadcrumb = document.querySelector('.top .lx-breadcrumb b');
    if (breadcrumb) breadcrumb.textContent = '从模板起草';
    overlay.querySelectorAll('[data-template-choice]').forEach(button => button.addEventListener('click', () => {
      current.template = button.dataset.templateChoice; current.prepared = false; current.checked = false; state.templateDirty = true; renderTemplateWizard();
    }));
    overlay.querySelector('#lex-template-proc')?.addEventListener('change', event => { current.proc = event.target.value; current.prepared = false; current.checked = false; state.templateDirty = true; });
    overlay.querySelector('#lex-template-opposing')?.addEventListener('change', event => { current.opposing = event.target.value; current.prepared = false; current.checked = false; state.templateDirty = true; });
    overlay.querySelector('#lex-template-third')?.addEventListener('change', event => { current.third = event.target.value; current.prepared = false; current.checked = false; state.templateDirty = true; });
    overlay.querySelector('#lex-template-folder')?.addEventListener('change', event => { current.folder = event.target.value; state.templateDirty = true; });
    overlay.querySelectorAll('[data-lex-source]').forEach(input => input.addEventListener('change', () => { current.sources = [...overlay.querySelectorAll('[data-lex-source]:checked')].map(item => item.dataset.lexSource); current.prepared = false; current.checked = false; state.templateDirty = true; }));
    overlay.querySelector('#lex-template-title')?.addEventListener('input', event => { current.title = event.target.value; current.prepared = false; current.checked = false; state.templateDirty = true; updateWizardFooter(overlay, current); });
    overlay.querySelector('#lex-template-body')?.addEventListener('input', event => { current.body = event.target.value; current.prepared = false; current.checked = false; state.templateDirty = true; updateWizardFooter(overlay, current); });
    overlay.querySelector('#lex-template-checked')?.addEventListener('change', event => { current.checked = event.target.checked; state.templateDirty = true; updateWizardFooter(overlay, current); });
    overlay.querySelector('[data-template-recheck]')?.addEventListener('click', () => { current.prepared = true; current.checked = false; state.templateDirty = true; renderTemplateWizard(); });
    overlay.querySelector('[data-template-next]')?.addEventListener('click', () => { current.step += 1; renderTemplateWizard(); });
    overlay.querySelector('[data-template-back]')?.addEventListener('click', () => { if (current.step === 1) requestCloseTemplate(); else { current.step -= 1; renderTemplateWizard(); } });
    overlay.querySelector('[data-template-close]')?.addEventListener('click', requestCloseTemplate);
    overlay.querySelector('[data-template-generate]')?.addEventListener('click', generateTemplate);
  }
  function updateWizardFooter(overlay, current) {
    const next = overlay.querySelector('[data-template-next]');
    const generate = overlay.querySelector('[data-template-generate]');
    if (next) next.disabled = current.step === 1 ? !current.template : !current.title.trim() || !current.body.trim();
    if (generate) generate.disabled = !current.prepared || !current.checked || !current.title.trim() || !current.body.trim();
  }
  function requestCloseTemplate() {
    if (!state.template) return;
    if (state.templateDirty) {
      const overlay = document.getElementById('lex-template-overlay');
      if (overlay?.querySelector('.lex-discard')) return;
      overlay?.insertAdjacentHTML('beforeend', `<div class="lex-discard-backdrop"><div class="lex-discard"><strong>放弃未保存的起草内容？</strong><p>继续填写会保留当前模板和字段。</p><div><button class="btn" data-lex-keep>继续填写</button><button class="btn primary" data-lex-discard>放弃修改</button></div></div></div>`);
      overlay?.querySelector('[data-lex-keep]')?.addEventListener('click', () => overlay.querySelector('.lex-discard-backdrop')?.remove());
      overlay?.querySelector('[data-lex-discard]')?.addEventListener('click', () => { state.templateDirty = false; state.templateSnapshot = null; state.template = null; history.back(); });
      return;
    }
    history.back();
  }
  function closeTemplateOverlay(preserve = true) {
    if (preserve && state.template) state.templateSnapshot = structuredClone(state.template);
    if (!preserve) state.templateSnapshot = null;
    document.getElementById('lex-template-overlay')?.remove();
    state.template = null;
    state.templateDirty = false;
    ensureTopbar();
  }
  function generateTemplate() {
    const current = state.template;
    if (!current || !current.prepared || !current.checked || !current.title.trim() || !current.body.trim()) return;
    const db = readDb();
    const matter = db?.[current.caseId];
    if (!matter || scene() === 'readonly') return;
    const id = unique(current.caseId, 'D');
    const family = unique(current.caseId, 'F');
    const title = current.title.trim().replace(/\.docx$/i, '') + '.docx';
    matter.docs.unshift({ id, family, title, version: 1, status: 'DRAFT', proc: Number(current.proc), subject: caseInfo[current.caseId].client, origin: current.template, body: current.body.trim(), selection: { client: caseInfo[current.caseId].client, opposing: current.opposing, third: current.third, procedure: current.proc }, folder: current.folder, contextInputs: [...current.sources], issues: [], history: [{ label: '生成工作稿', note: '本案主体、程序与实际字段已核对。', at: new Date().toISOString() }], rev: 1 });
    window.__LEXORDER_PREVIEW_INITIAL__ = db;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch {}
    state.templateDirty = false;
    state.templateSnapshot = null;
    closeTemplateOverlay(false);
    history.replaceState(history.state, '', `${location.pathname}${location.hash}`);
    location.hash = navHash(current.caseId, 'drafts', id);
    location.reload();
  }
  function handleTemplateHistory(event) {
    const overlay = document.getElementById('lex-template-overlay');
    if (!overlay) {
      if (new URLSearchParams(location.search).get('template') === '1') openTemplateWizard(true);
      return;
    }
    if (state.templateDirty) {
      history.pushState({ ...(history.state || {}), lexTemplate: true }, '', `${location.pathname}?template=1${location.hash}`);
      event.stopImmediatePropagation();
      requestCloseTemplate();
    } else {
      closeTemplateOverlay();
    }
  }
  function renderAll() {
    const app = document.querySelector('.app');
    if (!app) return;
    const route = parseRoute();
    const routeKey = previewRouteKey(route);
    if (state.previewRoute && state.previewRoute !== routeKey) clearFilePreview(false);
    if (route.section === 'materials' && route.id && !state.previewFileId && state.previewDismissedRoute !== routeKey) {
      state.previewFileId = route.id;
      state.previewRoute = routeKey;
    }
    ensureSidebar(); ensureTopbar(); captureLegacyTriggers(); removeOldNavigation(); setActiveNav(route);
    if (route.global) { renderGlobalPlaceholder(route); syncCaseMeta(); return; }
    const db = readDb();
    if (!db?.[route.caseId]) return;
    if (route.section === 'materials' && !route.id) {
      const matter = db[route.caseId];
      const file = matter.files[0] || matter.docs[0];
      if (file) { navigate(navHash(route.caseId, 'materials', file.id)); return; }
    }
    recordCaseRoute(route);
    syncCaseMeta();
    const content = document.querySelector('.content');
    const board = content?.querySelector('.board');
    const work = ['drafts', 'review', 'delivery', 'seal'].includes(route.section);
    const group = work ? 'documents' : route.section;
    if (state.lastGroup !== group) {
      state.type = '全部'; state.status = '全部'; state.search = '';
      state.lastGroup = group;
    }
    if (route.section === 'seal') state.type = '用印申请';
    else if (state.type === '用印申请') state.type = '全部';
    ensureActionBar(route);
    const pageHeader = content?.querySelector(':scope > div:first-child');
    const pageHeading = pageHeader?.querySelector('h1');
    const pageDescription = pageHeader?.querySelector('p');
    const fullTitle = route.section === 'seal' ? pageTitles.seal : (['drafts', 'review', 'delivery'].includes(route.section) ? pageTitles.delivery : (pageTitles[route.section] || '案内工作区'));
    if (pageHeading && pageHeading.textContent !== fullTitle) pageHeading.textContent = fullTitle;
    if (pageDescription?.dataset.lexOriginal) pageDescription.textContent = pageDescription.dataset.lexOriginal;
    if (scene() === 'error') {
      if (board && board.dataset.lexError !== '1') {
        board.innerHTML = `<div class="lex-error-state"><div>${icon('file')}</div><h2>无法读取本案记录</h2><p>当前预览模拟读取失败。恢复后可继续查看原有记录。</p><button class="btn primary" data-lex-retry>重新读取</button></div>`;
        board.dataset.lexError = '1';
        board.style.gridTemplateColumns = '1fr';
        board.querySelector('[data-lex-retry]')?.addEventListener('click', () => { localStorage.setItem(SCENE_KEY, 'normal'); location.reload(); });
      }
      return;
    }
    if (board?.dataset.lexError === '1') { board.dataset.lexError = ''; location.reload(); return; }
    const supported = work || ['materials', 'archive'].includes(route.section);
    if (!supported) { renderPlaceholder(route); return; }
    content?.querySelector('.lex-section-placeholder')?.remove();
    content?.querySelector('#lex-global-placeholder')?.remove();
    const actions = content?.querySelector('.lex-doc-actions');
    if (actions) actions.style.display = '';
    if (board && board.style.display !== '') board.style.display = '';
    renderQueue(route, db);
    renderInspector(route, db);
    renderFilePreview(route, db);
    ensureResizeHandles(board);
    const header = content?.querySelector(':scope > div:first-child h1');
    const heading = route.section === 'seal' ? pageTitles.seal : work ? '文书与交付' : (pageTitles[route.section] || '案件工作区');
    if (header && header.textContent !== heading) header.textContent = heading;
  }
    function scheduleRender() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = setTimeout(renderAll, 35);
  }
  function startObserver() {
    const app = document.querySelector('.app');
    if (!app || state.observer) return;
    state.observer = new MutationObserver(() => scheduleRender());
    state.observer.observe(app, { childList: true, subtree: true });
  }
  window.addEventListener('popstate', handleTemplateHistory, true);
  window.addEventListener('hashchange', scheduleRender);
  window.addEventListener('beforeunload', event => { if (state.template && state.templateDirty) { event.preventDefault(); event.returnValue = ''; } });
  const boot = () => { installStyle(); installFilePreviewDelegation(); renderAll(); startObserver(); if (new URLSearchParams(location.search).get('template') === '1') openTemplateWizard(true); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 30), { once: true });
  else setTimeout(boot, 30);
  setTimeout(boot, 250);
})();
</script></body></html>
