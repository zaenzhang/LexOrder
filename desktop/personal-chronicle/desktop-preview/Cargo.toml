[package]
name = "lexorder-chronicle-preview"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["dynamic-acl"] }
tauri-plugin-shell = "2.6"
tokio = { version = "1", features = ["time"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
