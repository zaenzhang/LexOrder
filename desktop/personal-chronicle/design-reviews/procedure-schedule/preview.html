/* Unified Chronicle shell: one navigation model for every business preview. */
.sidebar-brand-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sidebar-brand-row .brand{min-width:0;padding:5px 8px 13px}
.sidebar-collapse{width:28px;height:28px;flex:none;border:1px solid transparent;border-radius:7px;background:transparent;color:#758297;font-size:22px;line-height:1}
.sidebar-collapse:hover{background:#f2f5fa;border-color:#e5e9f0}
.workspace-switch-wrap{padding:0 2px 12px}
.workspace-switch{position:relative;min-height:58px;margin:0;cursor:pointer;box-shadow:0 1px 1px #1a2b4805}
.workspace-switch:focus-within{outline:3px solid #9bb5f1;outline-offset:2px}
.workspace-switch-copy{display:grid;min-width:0;flex:1;line-height:1.35}
.workspace-switch-copy b,.workspace-switch-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workspace-switch-copy small{margin-top:3px}
.workspace-chevron{font-size:13px;color:#8994a4}
.workspace-picker-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.sidebar-scroll{scrollbar-width:thin;scrollbar-color:#cbd3df transparent;overscroll-behavior:contain}
.sidebar-scroll::-webkit-scrollbar,.program-sequence-list::-webkit-scrollbar{width:6px}
.sidebar-scroll::-webkit-scrollbar-thumb,.program-sequence-list::-webkit-scrollbar-thumb{background:#cbd3df;border-radius:10px}
.nav-group{margin:7px 0 12px}
.nav-current-group{padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid #edf0f4}
.nav-group-label{font-weight:650;letter-spacing:.035em;padding:8px 11px 6px}
.nav-link{position:relative;min-height:35px;gap:10px;padding:8px 11px;margin:1px 0;font-size:13px;border-radius:7px;transition:background .12s ease,color .12s ease}
.nav-icon{width:17px;flex:none;text-align:center;color:#8490a1;font-size:15px;line-height:1}
.nav-link.active .nav-icon,.nav-parent.active-parent .nav-icon{color:#3158b7}
.nav-link.active{background:#edf2fd;color:#274eaa;font-weight:650}
.nav-parent .nav-expand{margin-left:auto;transition:transform .2s ease}
.nav-parent[aria-expanded="true"] .nav-expand{transform:rotate(180deg)}
.nav-sub{padding-left:25px}
.nav-sub .nav-link{min-height:31px;padding:6px 10px;font-size:12px}
.nav-sub .nav-label{white-space:nowrap}
.nav-parent.active-parent{color:#274eaa;background:#f5f7fc}
.nav-group-disabled{opacity:.36;filter:grayscale(.35);user-select:none}
.nav-group-disabled .nav-link{cursor:not-allowed}
.nav-group-disabled .nav-link:hover{background:transparent}
.sidebar-fixed{flex:none;padding-top:8px;margin-top:9px}
.sidebar-fixed .nav-link{min-height:33px}
.sidebar-user{min-height:48px}
.sidebar-user-copy{min-width:0}
.sidebar-user-copy b,.sidebar-user-copy small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-copy small{display:block;color:#7c8798;font-size:11px}
.route-code{display:inline-block;max-width:100%;overflow-wrap:anywhere;background:#f6f8fb;border:1px solid #e5eaf1;border-radius:6px;padding:8px 10px;font-size:12px;color:#54647a}.topbar{gap:14px}
.topbar-right{gap:10px}
.topbar .crumb{white-space:nowrap}
.nav-link:focus-visible,.sidebar-collapse:focus-visible,.workspace-picker-hit:focus-visible{outline:3px solid #9bb5f1;outline-offset:2px}
.chronicle-shell.collapsed{grid-template-columns:68px minmax(0,1fr)}
.chronicle-shell.collapsed .app-sidebar{padding:13px 7px 10px}
.chronicle-shell.collapsed .brand{justify-content:center;padding:5px 0 13px}
.chronicle-shell.collapsed .brand-mark{flex:none}
.chronicle-shell.collapsed .brand-text,
.chronicle-shell.collapsed .workspace-switch-copy,
.chronicle-shell.collapsed .workspace-chevron,
.chronicle-shell.collapsed .nav-group-label,
.chronicle-shell.collapsed .nav-label,
.chronicle-shell.collapsed .nav-expand,
.chronicle-shell.collapsed .sidebar-user-copy{display:none}
.chronicle-shell.collapsed .sidebar-collapse{width:100%;height:24px;font-size:18px}
.chronicle-shell.collapsed .workspace-switch{justify-content:center;min-height:42px;padding:6px;margin-bottom:7px}
.chronicle-shell.collapsed .workspace-switch .mark{width:30px;height:30px}
.chronicle-shell.collapsed .nav-link{justify-content:center;gap:0;padding:9px 6px}
.chronicle-shell.collapsed .nav-icon{width:auto;font-size:16px}
.chronicle-shell.collapsed .nav-sub{display:none!important}
.chronicle-shell.collapsed .sidebar-fixed .nav-link{justify-content:center}
.chronicle-shell.collapsed .sidebar-user{justify-content:center;padding:10px 0 1px}
.chronicle-shell.collapsed .program-layout{grid-template-columns:270px minmax(0,1fr)}

  const query=q.toString();return "#"+p+(query?"?"+query:"");
}
function parseHash(){

  if(!h)return{view:"procedures",matter:"A",procedure:"P1",scope:"all",layout:"board",month:"2026-11",day:"2026-11-19"};
  const [path,query=""]=h.slice(1).split("?"),q=Object.fromEntries(new URLSearchParams(query)),seg=path.split("/").filter(Boolean);

      if(q.task){base.view="taskDetail";base.taskId=q.task}
      else if(q.newTask==="1")base.view="newTask";
      else if(q.newProcedure==="1")base.view="newProcedure";
      else if(q.event){base.view="eventDetail";base.eventId=q.event}
      else if(q.newEvent==="1")base.view="newEvent";
      else base.view=q.view==="procedures"?"procedures":"tasks";
      if(!base.procedure||base.procedure==="P1")base.procedure=db?.procedures?.find(p=>p.matterId===base.matter)?.id||"P1";
      return base;
    }
    if(section==="materials"&&q.file){base.view="fileDetail";base.fileId=q.file;return base}
    base.view="placeholder";base.navKey=CASE_PATH_KEYS[section]||"case-overview";return base;
  }
  if(path==="/practice/archive"){base.view="archive";base.matter=matterKeyFromRoute(q.matter);base.procedure=q.procedure||db?.procedures?.find(p=>p.matterId===base.matter)?.id||"P1";return base}
  if(path==="/practice/schedule"){base.view=q.tab==="responsibilities"?"responsibilities":"calendar";base.matter="ALL";return base}
  if(path==="/practice/intakes"&&q.intake){base.view="intake";base.intakeId=q.intake;base.matter="ALL";return base}
  const pathToKey={
    "/practice/today":"workspace-today","/practice/clients":"workspace-clients-list","/practice/intakes":"workspace-intakes",
    "/practice/contacts":"workspace-contacts","/practice/conflicts":"workspace-conflicts","/practice/operations":"workspace-operations-desk",
    "/practice/operations/court-inbox":"workspace-court-inbox","/practice/finance":"workspace-finance","/practice/resources":"workspace-resources-list",
    "/practice/templates":"workspace-templates","/practice/reports":"workspace-reports","/practice/profile":"workspace-profile",
    "/practice/audit":"workspace-audit","/matters/list":"fixed-matters","/practice/notifications":"fixed-notifications","/settings":"fixed-settings"
  };
  base.view="placeholder";base.navKey=pathToKey[path]||"workspace-today";base.matter="ALL";return base;
}

    case"view-tasks":setView("tasks",{matter:route.matter==="ALL"?"A":route.matter,scope:"all"});break;
    case"view-procedures":setView("procedures",{matter:route.matter==="ALL"?"A":route.matter,procedure:route.procedure||db.procedures.find(p=>p.matterId===route.matter)?.id});break;
    case"view-responsibilities":setView("responsibilities",{matter:"ALL"});break;
    case"view-calendar":setView("calendar",{matter:"ALL",day:route.day||"2026-11-19"});break;
    case"all-matter-tasks":navigate({view:"tasks",matter:route.matter,scope:"all",scopeId:"",stageScope:"",layout:"board"});break;
    case"layout-board":navigate({layout:"board"},true);break;
    case"layout-table":navigate({layout:"table"},true);break;
    case"new-task":{
      const p=route.scope==="procedure"?proc(route.scopeId):null;
      navigate({view:"newTask",matter:route.matter,procedure:p?.id||route.procedure||"P1",stage:p?(route.stageScope||""):"",from:p?"procedure-workspace":route.view||"tasks",fromScope:p?"procedure":route.scope||"all",scope:p?"procedure":route.scope,scopeId:p?.id||route.scopeId||""});break;
    }
    case"new-task-stage":startTaskFromStage(target.dataset.stage,target.dataset.procedure);break;
    case"new-procedure":navigate({view:"newProcedure",matter:route.matter,from:"procedures"});break;
    case"new-hearing":navigate({view:"newEvent",matter:route.matter,procedure:route.procedure,kind:"hearing",from:route.scope==="procedure"?"procedure-workspace":"procedures",fromScope:route.scope||"all",scopeId:route.scopeId||""});break;
    case"new-deadline":navigate({view:"newEvent",matter:route.matter,procedure:route.procedure,kind:"deadline",from:route.scope==="procedure"?"procedure-workspace":"procedures",fromScope:route.scope||"all",scopeId:route.scopeId||""});break;
    case"go-archive":navigate({view:"archive",matter:route.matter,procedure:route.procedure,from:"procedures"});break;
    case"back":goBack();break;
    case"back-to-program":navigate({view:"procedures",matter:route.matter,scope:"all",scopeId:"",stageScope:""});break;
    case"open-global-calendar":navigate({view:"calendar",matter:"ALL"});break;
    case"start-complete":navigate({action:"DONE"},true);break;
    case"start-cancel":navigate({action:"CANCELLED"},true);break;
    case"start-reopen":navigate({action:"OPEN"},true);break;
    case"cancel-task-action":navigate({action:""},true);break;
    case"simulate-stale":{const t=task(target.dataset.task);if(t){t.revision++;t.history.push("模拟另一处保存");toastMessage="任务修订版本已变化。再次提交旧表单将被拒绝。";render()}break}
    case"open-procedure":{const id=target.dataset.procedure;const p=proc(id);if(p)navigate({view:"tasks",matter:p.matterId,procedure:id,scope:"procedure",scopeId:id,stageScope:"",layout:"board"});break;}
    case"month-prev":{const [y,m]=route.month.split("-").map(Number),d=new Date(Date.UTC(y,m-2,1));navigate({month:d.toISOString().slice(0,7),day:""});break}
    case"month-next":{const [y,m]=route.month.split("-").map(Number),d=new Date(Date.UTC(y,m,1));navigate({month:d.toISOString().slice(0,7),day:""});break}
    case"search-placeholder":toastMessage="搜索入口沿用 Chronicle Command Menu；本预览不复制全局搜索实现。";render();break;
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="workspacePicker"){switchWorkspace(t.value);return}
  if(t.dataset.change==="view"){
    const next=t.value;
    if(next==="calendar"||next==="responsibilities"){
      navigate({view:next,matter:"ALL",day:route.day||"2026-11-19"});
    }else{
      const target=route.matter!=="ALL"?route.matter:(shellState.lastMatter||"A");
      const first=db.procedures.find(p=>p.matterId===target)?.id||"P1";
      navigate({view:next,matter:target,procedure:route.procedure||first,scope:"all",layout:route.layout||"board"});
    }
    return;
  }
  if(t.dataset.change==="scope"){const val=t.value;const p=db.procedures.find(x=>x.matterId===route.matter);navigate({scope:val,scopeId:val==="procedure"?p?.id||"":val==="stage"?p?.stages[0]?.id||"":""},true);return}
  if(t.dataset.change==="scopeId"){navigate({scopeId:t.value,procedure:route.scope==="procedure"?t.value:route.procedure},true);return}
  if(t.dataset.change==="stageScope"){navigate({stageScope:t.value},true);return}
  if(t.dataset.field==="scopeKind"){const f=t.closest("form"),stageKind=t.value==="stage";f.querySelector("#procedureField").style.display=stageKind?"grid":"none";f.querySelector("#stageField").style.display=stageKind?"grid":"none";return}
  if(t.dataset.field==="procedureId"){const f=t.closest("form"),s=f.querySelector('[data-field="stageId"]');Array.from(s.options).forEach(o=>o.hidden=o.dataset.procedure!==t.value);if(s.selectedOptions[0]?.hidden)s.value=s.querySelector('option[data-procedure="'+t.value+'"]')?.value||"";return}
  if(t.name==="kind"&&t.closest('[data-form="new-event"]')){const f=t.closest("form");f.dataset.kind=t.value;f.querySelector('[name="at"]').type=t.value==="deadline"?"date":"datetime-local";f.querySelector("#precisionField").style.display=t.value==="deadline"?"grid":"none";f.querySelector("#remindField").style.display=t.value==="deadline"?"grid":"none";return}
});
document.addEventListener("input",ev=>{if(ev.target.dataset.input==="task-search"){route.q=ev.target.value;const pos=ev.target.selectionStart;render();const n=document.querySelector('[data-input="task-search"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("submit",ev=>{const f=ev.target;if(f.dataset.form==="new-task"){ev.preventDefault();taskCreateSubmit(f)}else if(f.dataset.form==="task-action"){ev.preventDefault();taskActionSubmit(f)}else if(f.dataset.form==="new-event"){ev.preventDefault();createEventSubmit(f)}else if(f.dataset.form==="new-procedure"){ev.preventDefault();newProcedureSubmit(f)}});
$("readonlyToggle").addEventListener("change",ev=>{readOnly=ev.target.checked;render()});
if(!location.hash)history.replaceState({},"",routeToHash(route));else route=parseHash();render();
</script></body></html>
